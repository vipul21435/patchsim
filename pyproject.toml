[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchsim"
version = "0.1.0"
description = "Measure how far textual similarity to the gold patch goes as a proxy for the correctness of a candidate patch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
patchsim = "patchsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
